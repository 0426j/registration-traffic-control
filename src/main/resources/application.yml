spring:
  application:
    name: registration-traffic-control

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rtc}
    username: ${DB_USER:rtc}
    password: ${DB_PASSWORD:rtc}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

server:
  port: ${SERVER_PORT:8080}

payment:
  mock:
    failure-rate: ${PAYMENT_MOCK_FAILURE_RATE:0.2}
    min-delay-ms: ${PAYMENT_MOCK_MIN_DELAY_MS:20}
    max-delay-ms: ${PAYMENT_MOCK_MAX_DELAY_MS:150}
